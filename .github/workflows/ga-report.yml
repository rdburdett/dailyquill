name: GA4 usage report

# Run from the Actions tab (or ask Claude) to see Daily Quill's usage numbers
# in the run summary. Reads Google Analytics through the free Data API.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to report'
        default: '28'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build report
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
        run: node scripts/ga-report.mjs "${{ inputs.days }}"
